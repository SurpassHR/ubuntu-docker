[supervisord]
nodaemon=true
user=root
pidfile=/var/run/supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true

[program:init]
command=/home/hr0530/boot/init.sh
autostart=true
startsecs=0
exitcodes=0
; init.sh: Run once at application startup
autorestart=false
startretries=0
user=hr0530

[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

