[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
priority=10

[program:mysqld]
command=/usr/local/bin/start-mysql.sh
user=mysql
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/mysql/stdout.log
stderr_logfile=/var/log/mysql/stderr.log

[program:1panel]
command=/usr/local/bin/start-1panel.sh
autostart=true
autorestart=true
startsecs=10
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gemini-balance]
command=/usr/local/bin/start-gemini-balance.sh
autostart=true
autorestart=true