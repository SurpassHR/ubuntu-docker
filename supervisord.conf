# --- 1Panel Service ---
# Manages the 1Panel application using our custom startup script.
[program:1panel]
command=/usr/local/bin/start-1panel.sh
autostart=true
autorestart=true
startsecs=10
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mysqld]
command=/usr/local/bin/start-mysql.sh
autostart=true
autorestart=true
user=mysql
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0